<div class="login-container">

    <h2>Login</h2>

    <form (ngSubmit)="login()">

      <div>
        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="loginRequest.email"
          required
        />
      </div>

      <div>
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="loginRequest.password"
          required
        />
      </div>

      <button type="submit">
        Login
      </button>

    </form>

  </div>
